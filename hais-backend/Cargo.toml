[package]
name = "hais-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9"
chrono = "0.4"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
dotenvy = "0.15"
lettre = "0.11"
redis = { version = "0.25", features = ["tokio-comp"] }
