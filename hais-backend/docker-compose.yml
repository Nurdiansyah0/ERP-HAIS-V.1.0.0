version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hais_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hais_db
    ports:
      - "5432:5432"
    volumes:
      - hais_pgdata:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:7-alpine
    container_name: hais_valkey
    ports:
      - "6379:6379"
    volumes:
      - hais_valkeydata:/data

volumes:
  hais_pgdata:
  hais_valkeydata:
